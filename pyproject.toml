[project]
name = "telegram-forwarder"
version = "2.0.0"
description = "Forwards Telegram messages to an n8n webhook, uploading photo attachments to S3-compatible storage."
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36,<2",
    "aioboto3>=13.2,<14",
    "aiohttp>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forwarder"]
