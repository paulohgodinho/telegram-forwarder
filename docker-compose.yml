services:
  telegram-forwarder:
    image: ghcr.io/paulohgodinho/telegram-forwarder:latest
    build:
      context: .
      target: runtime
    # Shares the host's network stack (incl. /etc/resolv.conf), so
    # hostnames like "n8n" resolve exactly as they do on the host.
    network_mode: host
    environment:
      WEB_AUTH_PORT: ${WEB_AUTH_PORT:-56899}
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH}
      TELEGRAM_N8N_WEBHOOK_URL: ${TELEGRAM_N8N_WEBHOOK_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-offers-storage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://offers-storage.web.internal.ghomelab.top}
    volumes:
      - telegram-forwarder-session:/app/session
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telegram-forwarder.rule=Host(`telegram-forwarder.internal.ghomelab.top`)"
      - "traefik.http.services.telegram-forwarder.loadbalancer.server.port=${WEB_AUTH_PORT:-56899}"
    container_name: telegram-forwarder
    restart: unless-stopped

volumes:
  telegram-forwarder-session:
